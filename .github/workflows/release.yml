name: Build and Release
on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: '--target aarch64-apple-darwin'
          - os: macos-latest
            args: '--target x86_64-apple-darwin'
          - os: ubuntu-22.04
            args: ''
          - os: windows-latest
            args: ''
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install dependencies (ubuntu only)
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Install frontend dependencies
        run: npm install

      - name: Setup Tauri Signing Key
        env:
          RAW_SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          node -e '
            const fs = require("fs");
            const rawKey = (process.env.RAW_SIGNING_KEY || "").trim();
            if (!rawKey) {
              console.error("Warning: TAURI_SIGNING_PRIVATE_KEY secret is not set!");
              process.exit(1);
            }
            let base64Key = rawKey;
            if (rawKey.startsWith("untrusted comment")) {
              base64Key = Buffer.from(rawKey).toString("base64");
            } else {
              base64Key = rawKey.replace(/\s+/g, "");
            }
            console.log("Successfully prepared signing key (length: " + base64Key.length + ")");
            fs.appendFileSync(process.env.GITHUB_ENV, "TAURI_SIGNING_PRIVATE_KEY=" + base64Key + "\nTAURI_SIGNING_PRIVATE_KEY_PASSWORD=\n");
          '

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: latest
          releaseName: "Latest Build"
          releaseBody: "Automated build of the latest commit on main."
          releaseDraft: false
          prerelease: true
          includeUpdaterJson: true
          args: ${{ matrix.args }}

